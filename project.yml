name: Viaduct
options:
  bundleIdPrefix: com.magicelk235
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.4.0"
    # Sparkle compares CFBundleVersion, so it has to move every release.
    # Keeping it equal to the marketing version means one number to bump.
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Universal, spelled out rather than left to ARCHS_STANDARD: Intel Macs are a
    # supported target and a silent Xcode default change must not drop them. The
    # appex has to match the app, so this lives at project level.
    ARCHS: arm64 x86_64
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"
targets:
  Viaduct:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - ViaductTests
    sources:
      - path: Sources
      - path: AppIcon.icon
      # Only the AccentColor lives here: the app's teal for system-drawn
      # controls (sidebar selection, checkboxes, progress bars), which ignore
      # SwiftUI's .tint and would otherwise come out macOS blue.
      - path: Assets.xcassets
      - path: icon.png
        buildPhase: resources
      - path: Resources/bin
        type: folder
        buildPhase: resources
      # Firefox's helpers, built by the "Build Persist" phase. Optional because a
      # fresh checkout doesn't have the folder until the first build makes it.
      - path: Resources/firefox
        type: folder
        buildPhase: resources
        optional: true
      # The Firefox agent's launchd plist, where SMAppService.agent(plistName:)
      # looks for it.
      - path: Resources/LaunchAgents/com.magicelk235.viaduct.firefox-agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: ViaductExtension
        embed: true
      - target: ViaductHelper
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleName: Viaduct
        CFBundleDisplayName: Viaduct
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Sparkle: appcast.xml rides along with every GitHub release, so
        # /releases/latest/download always resolves to the current feed.
        SUFeedURL: "https://github.com/magicelk235/viaduct-app/releases/latest/download/appcast.xml"
        SUPublicEDKey: "apcUCBF2JH7SFuH8ohkVJGa+zu9Yzu21IAYbvwI1vbM="
        # Install in the background once the user allows checks. Sparkle still
        # asks permission once on first launch before it phones home.
        SUAutomaticallyUpdate: true
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "Copyright © 2026 Yehonatan Cohen. PolyForm Shield License 1.0.0."
        LSApplicationCategoryType: public.app-category.developer-tools
        # macOS asks before one app reads another's data. Import from Chrome and
        # bringing settings over read the browser's profile folder, and without
        # a reason here the prompt reads like something to deny.
        NSAppDataUsageDescription: "Viaduct reads the extensions installed in your browsers, and their saved settings, so it can bring them over to Safari."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - viaduct
            CFBundleURLName: com.magicelk235.viaduct
        # Polar license keys and checkout. Not secrets: the app only calls
        # Polar's public customer-portal endpoints. The owner fills these in,
        # and release.sh won't notarize a release while any is empty.
        PolarOrganizationID: ""
        PolarBenefitFirefox: ""
        PolarBenefitSafari: ""
        PolarBenefitMixed: ""
        PolarCheckoutFirefox: ""
        PolarCheckoutSafari: ""
        PolarCheckoutMixed: ""
        PolarPortalURL: ""
    entitlements:
      path: Viaduct.entitlements
      properties:
        # NO app-sandbox. The app shells out to node/xcodebuild/lsregister/open;
        # the sandbox blocks exec of those binaries entirely, breaking the whole pipeline.
        # MAS distribution was never viable for a tool that drives the dev toolchain.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelk235.viaduct
        ENABLE_HARDENED_RUNTIME: false
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Fetch Node
        # Download a self-contained universal node into Resources/bin/node so the
        # shipped .app carries its own runtime on either chip — the user never
        # installs Node. Idempotent.
        script: "\"$SRCROOT/Resources/bin/fetch-node.sh\""
        basedOnDependencyAnalysis: false
      - name: Build Persist
        # Bundle persist (PERSIST_DIR, default ../c2f-persist) and the lavaduct modules it imports into
        # Resources/firefox/persist.mjs for the bundled node. Needs npm on the
        # build machine. Skips when the bundle is newer than its sources.
        script: "\"$SRCROOT/Resources/bin/build-persist.sh\""
        basedOnDependencyAnalysis: false

  ViaductExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
    info:
      path: Extension/Info.plist
      properties:
        CFBundleName: ViaductExtension
        CFBundleDisplayName: Viaduct Extension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "Copyright © 2026 Yehonatan Cohen. PolyForm Shield License 1.0.0."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: SafariWebExtensionHandler
    entitlements:
      path: Extension/ViaductExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelk235.viaduct.Extension
        ENABLE_HARDENED_RUNTIME: false
        OTHER_LDFLAGS: ["-Xlinker", "-u", "-Xlinker", "_OBJC_CLASS_$_SafariWebExtensionHandler"]
    postBuildScripts:
      # Safari caches a web extension by the version in its manifest, so a
      # manifest stuck at one number lets an updated app keep serving the old
      # content script until the user toggles the extension off and on. Stamp
      # the built copy from MARKETING_VERSION; the checked-in manifest.json
      # keeps its placeholder, since JSON has nowhere to put $(MARKETING_VERSION).
      - name: Stamp manifest version
        script: |
          manifest="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/manifest.json"
          /usr/bin/sed -i '' -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$MARKETING_VERSION\"/" "$manifest"
          grep -q "\"version\": \"$MARKETING_VERSION\"" "$manifest" \
            || { echo "error: manifest version not stamped in $manifest"; exit 1; }
        basedOnDependencyAnalysis: false

  # The program the Firefox agent's plist runs. `ViaductHelper agent` turns
  # into the bundled node running persist.mjs.
  ViaductHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    settings:
      base:
        PRODUCT_NAME: ViaductHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelk235.viaduct.helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: false

  ViaductTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ViaductTests
      - path: Helper/HelperAgent.swift
    dependencies:
      - target: Viaduct
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelk235.viaduct.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Viaduct.app/Contents/MacOS/Viaduct"
        BUNDLE_LOADER: "$(TEST_HOST)"
