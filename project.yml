name: Viaduct
options:
  bundleIdPrefix: com.magicelk235
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.5"
    # Sparkle compares CFBundleVersion, so it has to move every release.
    # Keeping it equal to the marketing version means one number to bump.
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Universal, spelled out rather than left to ARCHS_STANDARD: Intel Macs are a
    # supported target and a silent Xcode default change must not drop them. The
    # appex has to match the app, so this lives at project level.
    ARCHS: arm64 x86_64
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.5"
targets:
  Viaduct:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: AppIcon.icon
      - path: icon.png
        buildPhase: resources
      - path: Resources/bin
        type: folder
        buildPhase: resources
    dependencies:
      - target: ViaductExtension
        embed: true
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleName: Viaduct
        CFBundleDisplayName: Viaduct
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Sparkle: appcast.xml rides along with every GitHub release, so
        # /releases/latest/download always resolves to the current feed.
        SUFeedURL: "https://github.com/magicelk235/viaduct-app/releases/latest/download/appcast.xml"
        SUPublicEDKey: "apcUCBF2JH7SFuH8ohkVJGa+zu9Yzu21IAYbvwI1vbM="
        # Install in the background once the user allows checks. Sparkle still
        # asks permission once on first launch before it phones home.
        SUAutomaticallyUpdate: true
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "Copyright © 2026 Yehonatan Cohen. PolyForm Shield License 1.0.0."
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - viaduct
            CFBundleURLName: com.magicelk235.viaduct
    entitlements:
      path: Viaduct.entitlements
      properties:
        # NO app-sandbox. The app shells out to node/xcodebuild/lsregister/open;
        # the sandbox blocks exec of those binaries entirely, breaking the whole pipeline.
        # MAS distribution was never viable for a tool that drives the dev toolchain.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelk235.viaduct
        ENABLE_HARDENED_RUNTIME: false
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Fetch Node
        # Download a self-contained universal node into Resources/bin/node so the
        # shipped .app carries its own runtime on either chip — the user never
        # installs Node. Idempotent.
        script: "\"$SRCROOT/Resources/bin/fetch-node.sh\""
        basedOnDependencyAnalysis: false

  ViaductExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
    info:
      path: Extension/Info.plist
      properties:
        CFBundleName: ViaductExtension
        CFBundleDisplayName: Viaduct Extension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "Copyright © 2026 Yehonatan Cohen. PolyForm Shield License 1.0.0."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: SafariWebExtensionHandler
    entitlements:
      path: Extension/ViaductExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelk235.viaduct.Extension
        ENABLE_HARDENED_RUNTIME: false
        OTHER_LDFLAGS: ["-Xlinker", "-u", "-Xlinker", "_OBJC_CLASS_$_SafariWebExtensionHandler"]
    postBuildScripts:
      # Safari caches a web extension by the version in its manifest, so a
      # manifest stuck at one number lets an updated app keep serving the old
      # content script until the user toggles the extension off and on. Stamp
      # the built copy from MARKETING_VERSION; the checked-in manifest.json
      # keeps its placeholder, since JSON has nowhere to put $(MARKETING_VERSION).
      - name: Stamp manifest version
        script: |
          manifest="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/manifest.json"
          /usr/bin/sed -i '' -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$MARKETING_VERSION\"/" "$manifest"
          grep -q "\"version\": \"$MARKETING_VERSION\"" "$manifest" \
            || { echo "error: manifest version not stamped in $manifest"; exit 1; }
        basedOnDependencyAnalysis: false
